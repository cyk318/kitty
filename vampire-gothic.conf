# Nocturne Violet: velvet purple with silver and muted rose accents.
# Color-only overlay for the existing Obsidian setup.
background #120f19
foreground #d8d1e1
selection_background #49355f
selection_foreground #eee8f4
url_color #c4addf

# Preserve semantic ANSI colors for tools, with restrained saturation.
color0  #241c30
color1  #b78fa6
color2  #96a996
color3  #b9aa91
color4  #a0a4c5
color5  #b39bce
color6  #9aafb4
color7  #d8d1e1
color8  #8c7e9d
color9  #c6a0b9
color10 #adbfaa
color11 #cdbda3
color12 #b7bbdb
color13 #ceb8e6
color14 #b0c4c8
color15 #eee8f4

cursor #c4addf
cursor_text_color #120f19
cursor_trail_color #82679f
active_border_color #82679f
inactive_border_color #30263e
bell_border_color #c6a0b9
tab_bar_background #120f19
active_tab_foreground #eee8f4
active_tab_background #38264f
inactive_tab_foreground #bba7d2
inactive_tab_background #120f19

# Reuse the existing hint action and key bindings with matching colors.
action_alias obsidian_hints kitten hints --alphabet asdfghjklqwertyuiopzxcvbnm --hints-offset 0 --prefix-free --hints-foreground-color #eee8f4 --hints-background-color #49355f --hints-text-color #d8d1e1
