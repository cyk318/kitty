# 黑曜石 / 冰青主题：适用于 macOS Kitty 0.49.2，仅使用原生效果。
# 由 kitty.conf 最后加载；同名设置以本文件为准，移除 include 可恢复原外观。

# 使用已安装的等宽 Nerd Font，兼顾代码对齐和开发图标。
font_family JetBrainsMono Nerd Font Mono
# 自动匹配字体家族中的粗体。
bold_font auto
# 自动匹配字体家族中的斜体。
italic_font auto
# 自动匹配字体家族中的粗斜体。
bold_italic_font auto
# 基础字号，单位为点；保留当前设置的 17pt。
font_size 17.5

# 主背景：深蓝黑色。
background #0c111b
# 主文字：柔和的灰白色。
foreground #cbd5e1
# 选中文本的背景色。
selection_background #29465a
# 选中文本的文字色。
selection_foreground #f0f6fc
# 链接提示色。
url_color #7dcfff
# ANSI 普通黑色：避免与主背景完全重合。
color0  #192231
# ANSI 普通红色：错误、删除等提示。
color1  #e98996
# ANSI 普通绿色：成功、新增等提示。
color2  #91c9a1
# ANSI 普通黄色：警告等提示。
color3  #dfc184
# ANSI 普通蓝色。
color4  #86aee8
# ANSI 普通紫色。
color5  #b7a4df
# ANSI 普通青色。
color6  #78c9d2
# ANSI 普通白色。
color7  #cbd5e1
# ANSI 亮黑色：用于次要文字，保持可读性。
color8  #718198
# ANSI 亮红色。
color9  #f0a0aa
# ANSI 亮绿色。
color10 #a8d9b4
# ANSI 亮黄色。
color11 #ebd49c
# ANSI 亮蓝色。
color12 #a2c4f5
# ANSI 亮紫色。
color13 #cbb9ef
# ANSI 亮青色。
color14 #9cdee4
# ANSI 亮白色。
color15 #edf3fa

# 冰青色光标，便于在深色背景中定位。
cursor #8bd5df
# 块状光标覆盖的文字颜色。
cursor_text_color #0c111b
# 默认使用块状光标；应用仍可自行切换形状。
cursor_shape block
# 窗口失去焦点时改用空心光标。
cursor_shape_unfocused hollow
# 关闭光标闪烁，减轻长时间使用的视觉干扰。
cursor_blink_interval 0
# 光标停留至少 3 毫秒才触发拖尾，过滤快速界面重绘。
cursor_trail 3
# 拖尾消退时间：最快 0.08 秒、最慢 0.18 秒，避免长残影。
cursor_trail_decay 0.08 0.18
# 至少跨越 2 个字符单元才显示拖尾，普通逐字输入不拖尾。
cursor_trail_start_threshold 2
# 拖尾使用较暗的青色，避免抢过正文的亮度。
cursor_trail_color #67aebd
# Kitty 内置运动模糊着色器，让拖尾移动更连贯。
custom_shaders cursor-trail-motion-blur
# 启用 shell 集成，但不让提示符自动把块状光标改成细竖线。
shell_integration enabled no-cursor
# 与显示器刷新同步，减少画面撕裂。
sync_to_monitor yes

# 背景不透明度 82%（约 18% 透出桌面），文字保持清晰。
background_opacity 0.82
# 允许运行中使用快捷键调整背景不透明度。
dynamic_background_opacity yes
# macOS 背景模糊半径，营造磨砂玻璃效果并弱化桌面干扰。
background_blur 12
# 文字区域四周留白，单位为点。
window_padding_width 12
# 分屏外侧不额外留空隙。
window_margin_width 0
# 分屏边框宽度。
window_border_width 1pt
# 当前分屏的边框颜色。
active_border_color #67aebd
# 非当前分屏的边框颜色。
inactive_border_color #263244
# 收到终端响铃时的边框提示色。
bell_border_color #dfc184
# 非当前分屏的文字不变暗。
inactive_text_alpha 1.0
# 隐藏标题栏，保持简洁；保留窗口管理能力。
hide_window_decorations titlebar-only
# 标题栏可见时沿用终端背景色。
macos_titlebar_color background

# 标签栏放在窗口顶部。
tab_bar_edge top
# 至少两个标签页时才显示标签栏。
tab_bar_min_tabs 2
# 使用简洁分隔线样式，不使用复杂装饰。
tab_bar_style separator
# 标签之间的分隔符及留白。
tab_separator "  │  "
# 标签栏左右留白。
tab_bar_margin_width 8
# 标签栏外侧与内侧的纵向留白。
tab_bar_margin_height 6 4
# 标签栏底色。
tab_bar_background #0c111b
# 当前标签的文字颜色。
active_tab_foreground #9cdee4
# 当前标签的背景颜色。
active_tab_background #1b2b3b
# 当前标签使用粗体。
active_tab_font_style bold
# 非当前标签的文字颜色。
inactive_tab_foreground #8494aa
# 非当前标签的背景颜色。
inactive_tab_background #0c111b
# 非当前标签使用普通字重。
inactive_tab_font_style normal
# 显示序号、最多 32 个字符的标题，以及响铃和活动提示。
tab_title_template " {index}  {title[:32]}{bell_symbol}{activity_symbol} "

# 默认分屏布局；stack 用于临时只显示当前分屏。
enabled_layouts splits,stack
# 保留原生 Cmd+T、Cmd+W、Cmd+数字、Cmd+R 和 Cmd+Shift+[ / ]。
# 分屏采用两段按键：先 Cmd+D，再按方向键；新 shell 沿用当前目录。
# 如果正处于专注模式，先恢复分屏布局，再创建新分屏。
# 左：先创建左右分屏，再把新分屏移到原分屏左侧。
map cmd+d>left combine : goto_layout splits : launch --location=vsplit --cwd=current : move_window left
# 右：在当前分屏右侧创建新分屏。
map cmd+d>right combine : goto_layout splits : launch --location=vsplit --cwd=current
# 上：先创建上下分屏，再把新分屏移到原分屏上方。
map cmd+d>up combine : goto_layout splits : launch --location=hsplit --cwd=current : move_window up
# 下：在当前分屏下方创建新分屏。
map cmd+d>down combine : goto_layout splits : launch --location=hsplit --cwd=current
# 也支持按完 D 后继续按住 Cmd，再按左方向键。
map cmd+d>cmd+left combine : goto_layout splits : launch --location=vsplit --cwd=current : move_window left
# 按住 Cmd 再按右方向键。
map cmd+d>cmd+right combine : goto_layout splits : launch --location=vsplit --cwd=current
# 按住 Cmd 再按上方向键。
map cmd+d>cmd+up combine : goto_layout splits : launch --location=hsplit --cwd=current : move_window up
# 按住 Cmd 再按下方向键。
map cmd+d>cmd+down combine : goto_layout splits : launch --location=hsplit --cwd=current
# Cmd+Option+左：切换到左侧分屏。
map cmd+alt+left neighboring_window left
# Cmd+Option+右：切换到右侧分屏。
map cmd+alt+right neighboring_window right
# Cmd+Option+上：切换到上方分屏。
map cmd+alt+up neighboring_window up
# Cmd+Option+下：切换到下方分屏。
map cmd+alt+down neighboring_window down
# Cmd+Shift+Enter：专注当前分屏，再按一次恢复原布局。
map cmd+shift+enter toggle_layout stack
# Cmd+Ctrl+O：临时改为完全不透明，适合阅读或明亮桌面。
map cmd+ctrl+o set_background_opacity 1
# Cmd+Ctrl+P：恢复本主题的半透明背景。
map cmd+ctrl+p set_background_opacity 0.82

# 关闭终端响铃声音。
enable_audio_bell no
# 关闭响铃时的画面闪烁。
visual_bell_duration 0
# 用标签页上的圆点提示响铃；保留原有滚动历史设置。
bell_on_tab "●"
