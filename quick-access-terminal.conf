# Kitty 原生下拉终端：Option+空格由登录自启动的原生热键助手负责。
# 当前屏幕 1512×982；以下尺寸针对当前屏幕，不是自动百分比布局。
# 贴住屏幕顶部，横向自动占满屏幕。
edge top
# 内容高度 738px，加上实测 48px 留白后约为屏幕高度的 80%。
lines 738px
# 使用置顶面板类型；macOS 的实际窗口层级由下一项精确控制。
layer top
# 浮在普通窗口上方，但低于输入法候选框和菜单，避免中文盲打。
kitty_override macos_ns_window_layer=NSFloatingWindowLevel
# 左侧不留边距。
margin_left 0
# 右侧不留边距。
margin_right 0
# 顶部不额外留边距。
margin_top 0
# 失去焦点时保持显示，由 Option+空格主动隐藏。
hide_on_focus_loss no
# 下拉终端独立覆盖背景不透明度，需与 obsidian.conf 保持一致。
# 82% 不透明度，即约 18% 透出桌面；文字不会跟随背景变透明。
background_opacity 0.82
# 继承主配置，以及主配置末尾加载的主题、字体和快捷键。
kitty_conf kitty.conf
